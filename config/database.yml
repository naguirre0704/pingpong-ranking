# Database configuration.
#
#   development / production -> PostgreSQL (Supabase) via DATABASE_URL
#   test                     -> local SQLite file (offline, never touches Supabase)
#
# Set DATABASE_URL in a local .env (development) or in the host env (production).
# Supabase: Project Settings -> Database -> Connection string -> URI.

default: &default
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  adapter: postgresql
  encoding: unicode
  <% if ENV["DATABASE_URL"].present? %>
  url: <%= ENV["DATABASE_URL"] %>
  <% else %>
  database: pingpong_ranking_development
  <% end %>

# SQLite keeps the test suite fast and self-contained. Models use plain
# column types + Active Record validations (no Postgres-only features),
# so behaviour matches production.
test:
  <<: *default
  adapter: sqlite3
  database: storage/test.sqlite3
  timeout: 5000

production:
  <<: *default
  adapter: postgresql
  encoding: unicode
  <% if ENV["DATABASE_URL"].present? %>
  url: <%= ENV["DATABASE_URL"] %>
  <% else %>
  database: pingpong_ranking_production
  <% end %>
